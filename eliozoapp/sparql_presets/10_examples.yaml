# Preset SPARQL queries for the "Advanced search" page (/advanced_search).
# See README.md in this directory for the file format.
title: {lv: "Piemēri", en: "Examples", lt: "Pavyzdžiai"}
items:
  - title: {lv: "Vienkāršs saraksts", en: "Plain list", lt: "Paprastas sąrašas"}
    query: |
      # AMO 2011. gada 5. klases uzdevumi.
      # Vaicājumam jāatlasa mainīgais ?problemID.
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT ?problemID
      WHERE {
        ?p a eliozo:Problem ;
           eliozo:problemID ?problemID ;
           eliozo:olympiadCode "AMO" ;
           eliozo:problemYear 2011 ;
           eliozo:problemGrade 5 .
      }
      ORDER BY ?problemID
  - title: {lv: "Grupēti", en: "Grouped", lt: "Sugrupuoti"}
    items:
      - title: {lv: "Pa klasēm (?section)", en: "By grade (?section)", lt: "Pagal klases (?section)"}
        query: |
          # Uzdevumi ar video atrisinājumu, sagrupēti pa klasēm.
          # Mainīgā ?section vērtības kļūst par apakšvirsrakstiem.
          PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
          SELECT ?problemID (CONCAT(STR(?grade), ". klase") AS ?section)
          WHERE {
            ?p a eliozo:Problem ;
               eliozo:problemID ?problemID ;
               eliozo:problemGrade ?grade ;
               eliozo:hasVideo ?video .
          }
          ORDER BY ?grade ?problemID
      - title: {lv: "Divos līmeņos (?section, ?subsection)", en: "Two levels (?section, ?subsection)", lt: "Dviem lygiais (?section, ?subsection)"}
        query: |
          # 2024. gada uzdevumi: ?section - olimpiāde, ?subsection - nozare.
          PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
          SELECT ?problemID (?olympiad AS ?section) (?domain AS ?subsection)
          WHERE {
            ?p a eliozo:Problem ;
               eliozo:problemID ?problemID ;
               eliozo:olympiadCode ?olympiad ;
               eliozo:problemYear 2024 ;
               eliozo:domain ?domain .
          }
          ORDER BY ?olympiad ?domain ?problemID
  - title: {lv: "Teksta meklēšana ar REGEX", en: "Text search with REGEX", lt: "Teksto paieška su REGEX"}
    query: |
      # Uzdevumi, kuru latviskajā formulējumā ir vārds "šaha" vai "šahs".
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT DISTINCT ?problemID
      WHERE {
        ?p a eliozo:Problem ;
           eliozo:problemID ?problemID ;
           eliozo:problemText ?text .
        FILTER (LANGMATCHES(LANG(?text), "lv"))
        FILTER (REGEX(?text, "šah(a|s)", "i"))
      }
      ORDER BY ?problemID
