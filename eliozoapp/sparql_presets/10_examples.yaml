# Preset SPARQL queries for the "Advanced search" page (/advanced_search).
# See README.md in this directory for the file format.
title: {lv: "Piemēri", en: "Examples", lt: "Pavyzdžiai"}
items:
  - title: {lv: "Vienkāršs saraksts", en: "Plain list", lt: "Paprastas sąrašas"}
    label: plain-list
    query: |
      # Grade 5 problems of AMO (Latvian Open Olympiad) 2011.
      # A query must select the variable ?problemID.
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT ?problemID
      WHERE {
        ?p a eliozo:Problem ;
           eliozo:problemID ?problemID ;
           eliozo:olympiadCode "AMO" ;
           eliozo:problemYear 2011 ;
           eliozo:problemGrade 5 .
      }
      ORDER BY ?problemID
  - title: {lv: "Viena līmeņa grupas", en: "One-level groups", lt: "Vieno lygio grupės"}
    label: one-level-groups
    query: |
      # AMO, NOL and VOL problems of 2024 for grades 9-12, grouped by grade.
      # The values of ?section become subtitles;
      # within each grade, problems are ordered by olympiad and problem number.
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
      SELECT ?problemID (CONCAT(STR(?grade), ". klase") AS ?section)
      WHERE {
        ?p a eliozo:Problem ;
           eliozo:problemID ?problemID ;
           eliozo:olympiad ?olympiad ;
           eliozo:problemYear 2024 ;
           eliozo:problemGrade ?grade ;
           eliozo:problem_number ?number .
        FILTER (?olympiad IN ("LV.AMO", "LV.NOL", "LV.VOL"))
        FILTER (?grade >= 9 && ?grade <= 12)
      }
      ORDER BY ?grade ?olympiad xsd:integer(?number) ?problemID
  - title: {lv: "Divu līmeņu grupas", en: "Two-level groups", lt: "Dviejų lygių grupės"}
    label: two-level-groups
    query: |
      # Problems of 2024: ?section - olympiad, ?subsection - domain.
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT ?problemID (?olympiad AS ?section) (?domain AS ?subsection)
      WHERE {
        ?p a eliozo:Problem ;
           eliozo:problemID ?problemID ;
           eliozo:olympiadCode ?olympiad ;
           eliozo:problemYear 2024 ;
           eliozo:domain ?domain .
      }
      ORDER BY ?olympiad ?domain ?problemID
  - title: {lv: "Teksta meklēšana ar REGEX", en: "Text search with REGEX", lt: "Teksto paieška su REGEX"}
    label: regex-search
    query: |
      # Problems whose Latvian statement contains the word "šaha" or "šahs" (chess).
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT DISTINCT ?problemID
      WHERE {
        ?p a eliozo:Problem ;
           eliozo:problemID ?problemID ;
           eliozo:problemText ?text .
        FILTER (LANGMATCHES(LANG(?text), "lv"))
        FILTER (REGEX(?text, "šah(a|s)", "i"))
      }
      ORDER BY ?problemID
