# Preset SPARQL queries for the "Advanced search" page (/advanced_search).
# See README.md in this directory for the file format.
title: {lv: "Uzdevumu tipi", en: "Problem types", lt: "Uždavinių tipai"}
items:
  - title: {lv: "Jautājuma tips", en: "Question type", lt: "Klausimo tipas"}
    label: question-types
    query: |
      # For each question type (QTY_...) - at most 8 problems without images
      # (grades 7-8, since 2000; newest first), so that no single type
      # takes up the whole result limit.
      #
      # SPARQL has no "TOP N per group". Here: (1) a subquery orders the
      # candidates; (2) GROUP_CONCAT collects the IDs of each type into one string,
      # and REPLACE keeps the first 8 (regex: 7 times "ID space", then one more ID);
      # (3) problems are selected by checking whether their ID is in that string.
      # ?section is the name of the question type from the vocabulary (eliozo:Question).
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT ?problemID ?section
      WHERE {
        {
          SELECT ?type (REPLACE(GROUP_CONCAT(?id; separator=" "), "^((\\S+ ){7}\\S+).*$", "$1") AS ?firstIDs)
          WHERE {
            {
              SELECT ?type ?id
              WHERE {
                ?p eliozo:questionType ?type ;
                   eliozo:problemID ?id ;
                   eliozo:problemYear ?year ;
                   eliozo:problemGrade ?grade ;
                   eliozo:problemText ?text .
                FILTER (?year >= 2000 && ?grade >= 7 && ?grade <= 8)
                FILTER (LANGMATCHES(LANG(?text), "lv"))
                FILTER (!CONTAINS(?text, "!["))       # no image
              }
              ORDER BY DESC(?year) ?id
            }
          }
          GROUP BY ?type
        }
        ?q a eliozo:Question ;
           eliozo:questionID ?type ;
           eliozo:sorter_L1 ?L1 ;
           eliozo:sorter_L2 ?L2 ;
           eliozo:questionName ?section .
        FILTER (LANGMATCHES(LANG(?section), "lv"))
        ?p eliozo:questionType ?type ;
           eliozo:problemID ?problemID .
        FILTER (CONTAINS(CONCAT(" ", ?firstIDs, " "), CONCAT(" ", ?problemID, " ")))
      }
      ORDER BY ?L1 ?L2 ?problemID
  - title: {lv: "Vairāki atrisinājumi", en: "Multiple solutions", lt: "Keli sprendimai"}
    label: multiple-solutions
    query: |
      # Problems with at least two solutions, grouped by grade.
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT ?problemID (CONCAT(STR(?grade), ". klase") AS ?section)
      WHERE {
        {
          SELECT ?problemID ?grade (COUNT(DISTINCT ?solution) AS ?solutions)
          WHERE {
            ?p a eliozo:Problem ;
               eliozo:problemID ?problemID ;
               eliozo:problemGrade ?grade ;
               eliozo:problemSolution ?solution .
          }
          GROUP BY ?problemID ?grade
          HAVING (COUNT(DISTINCT ?solution) >= 2)
        }
      }
      ORDER BY ?grade ?problemID
  - title: {lv: "Attēli formulējumā", en: "Images in the statement", lt: "Paveikslai formuluotėje"}
    label: images-in-statement
    query: |
      # Problems with an image in the statement (in at least one language): a Markdown
      # image ![...](...) or HTML <img>. Grouped by olympiad or book.
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT DISTINCT ?problemID ?section
      WHERE {
        ?p a eliozo:Problem ;
           eliozo:problemID ?problemID ;
           eliozo:problemText ?text .
        FILTER (CONTAINS(?text, "![") || CONTAINS(?text, "<img"))
        OPTIONAL { ?p eliozo:olympiad ?olympiad }
        OPTIONAL { ?p eliozo:problemBook ?book }
        BIND (COALESCE(?olympiad, ?book, "Citi") AS ?section)
      }
      ORDER BY ?section ?problemID
  - title: {lv: "Attēli formulējumā vai atrisinājumos", en: "Images in the statement or solutions", lt: "Paveikslai formuluotėje ar sprendimuose"}
    label: images-anywhere
    query: |
      # Problems with an image in the statement or in any of the solutions (Markdown
      # ![...](...) or HTML <img>, any language). ?section tells where the image is.
      PREFIX eliozo: <http://www.dudajevagatve.lv/eliozo#>
      SELECT ?problemID ?section
      WHERE {
        ?p a eliozo:Problem ;
           eliozo:problemID ?problemID .
        BIND (EXISTS {
          ?p eliozo:problemText ?text .
          FILTER (CONTAINS(?text, "![") || CONTAINS(?text, "<img"))
        } AS ?inStatement)
        BIND (EXISTS {
          ?p eliozo:problemSolution ?solution .
          ?solution eliozo:solutionText ?solutionText .
          FILTER (CONTAINS(?solutionText, "![") || CONTAINS(?solutionText, "<img"))
        } AS ?inSolution)
        FILTER (?inStatement || ?inSolution)
        BIND (IF(?inStatement && ?inSolution, "1. Formulējumā un atrisinājumā",
                 IF(?inStatement, "2. Tikai formulējumā", "3. Tikai atrisinājumā")) AS ?section)
      }
      ORDER BY ?section ?problemID
